services:
  db:
    image: postgres:16-alpine
    container_name: movienow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-movienow}
      POSTGRES_USER: ${POSTGRES_USER:-movienow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-movienow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: movienow-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-movienow}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-movienow}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-movienow}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      # Clave por defecto segura (> 32 bytes). Reemplaza en producción.
      JWT_SECRET: ${JWT_SECRET:-6b9f7e2d1c3a5f8b0d4e6f7a9c1b3d5f7e9a1c3b5d7f9e1a3c5b7d9f1e3a5c7}
      MOVIENOW_API_KEY: ${MOVIENOW_API_KEY:-}
      MOVIENOW_API_TOKEN: ${MOVIENOW_API_TOKEN:-}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:5174
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      # Usa el contexto desde .env (sin comillas y con barras /)
      context: ${FRONTEND_CONTEXT}
      dockerfile: Dockerfile
      args:
        VITE_API_BACK_URL: /api
    container_name: movienow-frontend
    restart: unless-stopped

    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data: {}
