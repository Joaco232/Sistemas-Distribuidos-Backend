# Override de produccion (EC2). Se usa SIEMPRE junto al compose base:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Diferencias con el entorno local:
#   - db y backend dejan de publicar puertos al host: solo se llegan por la red de Docker
#   - el frontend pasa del 3000 al 80
#   - los secretos son obligatorios: si faltan, compose falla antes de levantar nada
#   - actuator se limita a health/info
#   - se apaga el log de SQL

services:
  db:
    # Sin puertos publicados, Postgres no queda expuesto a internet.
    # Para conectarte desde tu PC, tunel SSH:
    #   ssh -L 5432:localhost:5432 ec2-user@<ip-de-la-instancia>
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defini POSTGRES_PASSWORD en el .env del servidor}

  backend:
    # El frontend lo alcanza como http://backend:8080 por la red interna de Docker,
    # asi que no hace falta publicar el 8080 al host.
    ports: !reset []
    environment:
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Defini POSTGRES_PASSWORD en el .env del servidor}
      JWT_SECRET: ${JWT_SECRET:?Defini JWT_SECRET en el .env del servidor (minimo 32 bytes)}
      SPRING_JPA_SHOW_SQL: "false"
      # El application.yml expone "*", y nginx proxea /api/ al backend: eso deja
      # /api/actuator/env, /beans, /configprops, /threaddump y /loggers (POST, cambia
      # niveles de log en caliente) abiertos a internet. Aca se limita a lo minimo.
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info

  frontend:
    # Unico puerto publicado. El security group solo debe permitir 80 (y 22 desde tu IP).
    ports: !override
      - "80:80"
